name: Godot 4.7.2 validation

on:
  push:
    branches:
      - main
    paths:
      - "project.godot"
      - "scenes/**"
      - "scripts/**"
      - "data/**"
      - "tests/**"
      - ".github/workflows/godot-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Import project and run smoke tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Download and verify official Godot 4.7.2
        shell: bash
        env:
          GODOT_SHA256: cadd3204e728a35d3f13adb7fd0d7902636b79f6b95c40c265eb73b6c35329e4
        run: |
          set -euo pipefail
          archive="${RUNNER_TEMP}/godot-4.7.2-linux-x86_64.zip"
          curl --fail --location --retry 3 --retry-delay 2 \
            --output "${archive}" \
            "https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip"
          echo "${GODOT_SHA256}  ${archive}" | sha256sum --check -
          mkdir -p "${RUNNER_TEMP}/godot"
          unzip -q "${archive}" -d "${RUNNER_TEMP}/godot"
          chmod +x "${RUNNER_TEMP}/godot/Godot_v4.7.2-stable_linux.x86_64"
          echo "${RUNNER_TEMP}/godot" >> "${GITHUB_PATH}"
          echo "GODOT_BIN=${RUNNER_TEMP}/godot/Godot_v4.7.2-stable_linux.x86_64" >> "${GITHUB_ENV}"

      - name: Verify engine version
        shell: bash
        run: '"${GODOT_BIN}" --version'

      - name: Import and parse project
        shell: bash
        run: '"${GODOT_BIN}" --headless --path . --editor --quit'

      - name: Run gameplay smoke tests
        shell: bash
        run: '"${GODOT_BIN}" --verbose --headless --path . --script res://tests/smoke_test.gd'
